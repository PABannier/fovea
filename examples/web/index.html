<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fovea</title>
  </head>
  <body>
    <main id="app">
      <canvas id="viewer"></canvas>
      <section class="toolbar" aria-label="Viewer controls">
        <form id="bundle-form" class="bundle-form">
          <input
            id="bundle-url"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="/@fs/.../tcga-aa.fovea"
          />
          <button id="load-bundle" type="submit">Load</button>
        </form>
        <form id="overlay-form" class="bundle-form">
          <input
            id="overlay-url"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="/@fs/.../cells.overlay"
          />
          <button id="load-overlay" type="submit">Overlay</button>
        </form>
        <button id="reset-camera" type="button">Reset</button>
        <span id="load-status" class="load-status">Synthetic</span>
      </section>
      <section class="stats" aria-live="polite">
        <div><span>FPS</span><strong id="fps">0</strong></div>
        <div><span>p50</span><strong id="p50">0 ms</strong></div>
        <div><span>p95</span><strong id="p95">0 ms</strong></div>
        <div><span>p99</span><strong id="p99">0 ms</strong></div>
        <div><span>Frame</span><strong id="frame">0 ms</strong></div>
        <div><span>Upload</span><strong id="upload">0 ms</strong></div>
        <div><span>Draws</span><strong id="draws">0</strong></div>
        <div><span>Visible</span><strong id="visible">0</strong></div>
        <div><span>GPU buffers</span><strong id="gpu">0 MB</strong></div>
        <div><span>CPU temp</span><strong id="cpu">0 MB</strong></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
